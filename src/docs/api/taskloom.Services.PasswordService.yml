    id: IsPasswordValid
    path: app/Services/PasswordService.cs
    startLine: 41
  assemblies:
  - taskloom
  namespace: taskloom.Services
  summary: >-
    Проверяет, является ли пароль допустимым.

    Пароль считается допустимым, если он содержит:

    - Минимум 8 символов,

    - Хотя бы одну заглавную букву,

    - Хотя бы одну строчную букву,

    - Хотя бы одну цифру,

    - Хотя бы один специальный символ.
  example: []
  syntax:
    content: public virtual bool IsPasswordValid(string password)
    parameters:
    - id: password
      type: System.String
      description: Пароль для проверки.
    return:
      type: System.Boolean
      description: Значение true, если пароль допустим, иначе false.
    content.vb: Public Overridable Function IsPasswordValid(password As String) As Boolean
